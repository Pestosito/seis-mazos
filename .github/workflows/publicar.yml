# Prueba el motor, genera la app y la copia a la rama gh-pages, que GitHub Pages publica.
name: Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Copiar app/ a gh-pages
        run: |
          git fetch --depth 1 origin gh-pages
          git worktree add -B gh-pages /tmp/gh-pages origin/gh-pages
          cd /tmp/gh-pages
          git rm -rq .
          cp -r "$GITHUB_WORKSPACE/app/." .
          touch .nojekyll
          echo "$GITHUB_SHA" > publicado.txt
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push origin gh-pages
